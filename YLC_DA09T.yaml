data_sources:
  - name: sap_ylc_da01t_plata
    # ---------------------------------------------------------
    # ORIGEN Y DESTINO (Basado en las variables de Workbench)
    # ---------------------------------------------------------
    # En lugar de un 'path' con oci://, leemos una tabla de Spark:
    source_table: "dev_dwhdb_plata.dev_vtascob_plata.ylc_da09t"
    format: "table" 
    
    # Variable TARGET_TABLE (oci_iceberg.silver.repvtas_iceberg)
    target_table: "oci_iceberg.silver.repvtas_iceberg"
    
    # ---------------------------------------------------------
    # 1. Definición de tipos para el motor de Spark
    # ---------------------------------------------------------
    
    schema:
      - "BPARTNER:string"
      - "VALIDTO:string"
      - "CRM_PROD:string"
      - "FP_RTGRMET:string"
      - "FP_RTCRIT:string"
      - "RECORDMODE:string"
      - "VALIDFROM:string"
      - "FP_RTPERMT:string"
      - "FP_RTGRADE:string"
      - "FP_RTTENDY:string"
      - "TXTLG:string"
      - "FP_RTDWHEN:string"
    quality_checks:
      not_null: ["BPARTNER", "VALIDTO"]