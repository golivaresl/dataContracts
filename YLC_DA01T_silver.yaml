    # ---------------------------------------------------------
    # 2. Validaciones de Integridad y Calidad
    # ---------------------------------------------------------
    quality_checks:
      # Campos obligatorios que no pueden ser nulos o vacíos
      not_null: 
        - "BPARTNER"
        - "CHANGEDBY"
        - "CH_ON"
        - "CREATEDBY"
        - "CREATEDON"

      # Validación de longitud (Ideal para reglas de negocio)
      max_length:
        BPARTNER: 10
        RECORDMODE: 1
        BP_ACTITL1: 4
        BP_BTHNAME: 40
        BP_EXTERN: 20
        CHANGEDBY: 12
        CREATEDBY: 12
        CITY_2: 40
        /BIC/ZCURP: 20  
        /BIC/ZRFC: 10   

      # Validación de patrones (Regex) para asegurar formatos de fecha SAP
      patterns:
        # Formato DATS (8 dígitos: YYYYMMDD)
        CH_ON: '^[0-9]{8}$'
        CREATEDON: '^[0-9]{8}$'
        DATEBIRTH: '^[0-9]{8}$'
        BPDATEFROM: '^[0-9]{8}$'
        BPDATETO: '^[0-9]{8}$'
        
        # Formato TIMS (6 dígitos: HHMMSS)
        CH_AT: '^[0-9]{6}$'
        CREA_TIME: '^[0-9]{6}$'