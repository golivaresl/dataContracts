version: "1.1"
dataset_name: "wt_cntr_active"
description: "Contratos activos"

data_sources:
  - table_name: "dev_dwhdb_plata.dev_vtascob_plata.wt_cntr_active"

    columns:
      - name: "cntr_id"
        type: "decimal(38,10)"
      - name: "acct_group_id"
        type: "decimal(38,10)"
      - name: "acct_num"
        type: "decimal(38,10)"
      - name: "cntr_start_dt"
        type: "timestamp"
      - name: "cntr_end_dt"
        type: "timestamp"
      - name: "loan_capital_amt"
        type: "decimal(18,4)"
      - name: "sg_party_num"
        type: "decimal(38,10)"
      - name: "product_family_cd"
        type: "decimal(38,10)"

    quality_checks:

      # 🔹 Solo lo realmente obligatorio
      not_null:
        - "cntr_id"
        - "acct_num"
        - "cntr_start_dt"

      # 🔹 Mejor clave compuesta (validar en datos)
      unique_keys:
        - ["cntr_id", "acct_num"]

      # 🔹 Reglas de negocio
      range_checks:
        loan_capital_amt:
          min: 0

      # 🔹 Fechas coherentes
      date_checks:
        - rule: "cntr_start_dt <= cntr_end_dt"

      # 🔹 Opcional: controlar nulos pero sin romper pipeline
      soft_not_null:
        - "sg_party_num"
        - "product_family_cd"